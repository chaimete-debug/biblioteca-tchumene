<!DOCTYPE html>

<html lang="pt">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>
    Sem ligação - Biblioteca Tchumene
  </title>

  <link
    rel="manifest"
    href="/manifest.webmanifest"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;

      font-family:
        Arial,
        sans-serif;

      background:
        #f4f6f9;

      color:
        #1f2937;
    }


    .offline-card {

      width:
        min(
          430px,
          100%
        );

      background:
        #ffffff;

      padding:
        35px;

      border-radius:
        18px;

      text-align:
        center;

      box-shadow:
        0 5px 20px
        rgba(
          0,
          0,
          0,
          0.08
        );

    }


    .icon {

      font-size:
        60px;

      margin-bottom:
        15px;

    }


    h1 {

      margin:
        0 0 12px;

    }


    p {

      color:
        #64748b;

      line-height:
        1.5;

    }


    button {

      margin-top:
        25px;

      border:
        none;

      background:
        #2563eb;

      color:
        #ffffff;

      padding:
        12px 22px;

      border-radius:
        9px;

      cursor:
        pointer;

      font-size:
        15px;

    }

  </style>

</head>


<body>


  <div class="offline-card">

    <div class="icon">
      📚
    </div>

    <h1>
      Biblioteca Tchumene
    </h1>

    <p>
      Não foi possível estabelecer ligação à Internet.
    </p>

    <p>
      Algumas páginas da aplicação continuam disponíveis,
      mas operações como empréstimos, devoluções e novos
      registos precisam de ligação ao servidor.
    </p>

    <button
      onclick="window.location.reload()"
    >
      Tentar novamente
    </button>

  </div>


</body>

</html>
